# ===================================================
# E-Bookstore – Application Configuration
# ===================================================
# IMPORTANT: Copy this file to application.properties and fill in real values.
# Never commit application.properties with real secrets to version control.
# ===================================================

# Server
server.port=8080

# Application name
spring.application.name=ebookstore

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookstore}
spring.datasource.username=${DB_USERNAME:ebookstore_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# Set a strong random secret (>= 256 bits) via environment variable
app.jwt.secret=${JWT_SECRET:CHANGE_ME_THIS_IS_A_32_CHAR_DEV_SECRET}
app.jwt.expiration-ms=86400000

# ---- CORS (explicit allowlist – never use wildcard in production) ----
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# ---- Springdoc OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Logging ----
logging.level.root=INFO
logging.level.com.capstone.ebookstore=DEBUG
# Never log SQL params in production
logging.level.org.hibernate.type.descriptor.sql=WARN
